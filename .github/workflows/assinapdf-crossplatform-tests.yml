name: AssinaPDF CrossPlatform - Build e Testes

on:
  push:
    branches:
      - ajustes-interface-pdf
  pull_request:
    branches:
      - ajustes-interface-pdf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore src/AssinaPDF.CrossPlatform/AssinaPDF.MacPrototype.csproj

      - name: Compilar aplicativo CrossPlatform
        run: dotnet build src/AssinaPDF.CrossPlatform/AssinaPDF.MacPrototype.csproj --configuration Release --no-restore

      - name: Executar testes automatizados
        run: dotnet test tests/AssinaPDF.CrossPlatform.Tests/AssinaPDF.CrossPlatform.Tests.csproj --configuration Release
