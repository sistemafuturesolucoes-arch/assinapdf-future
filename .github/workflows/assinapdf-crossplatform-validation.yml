name: AssinaPDF CrossPlatform - Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/conversoes-fiscais-e-documentos-2026-11-16
    paths:
      - 'src/AssinaPDF.CrossPlatform/**'
      - 'tests/AssinaPDF.CrossPlatform.Tests/**'
      - 'public/favicon.ico'
      - '.github/workflows/assinapdf-crossplatform-validation.yml'
  pull_request:
    branches:
      - feature/conversoes-fiscais-e-documentos-2026-11-16
    paths:
      - 'src/AssinaPDF.CrossPlatform/**'
      - 'tests/AssinaPDF.CrossPlatform.Tests/**'
      - 'public/favicon.ico'
      - '.github/workflows/assinapdf-crossplatform-validation.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application and test project
        run: dotnet restore tests/AssinaPDF.CrossPlatform.Tests/AssinaPDF.CrossPlatform.Tests.csproj

      - name: Verify ImageSharp is not restored
        shell: pwsh
        run: |
          $packages = dotnet list src/AssinaPDF.CrossPlatform/AssinaPDF.MacPrototype.csproj package --include-transitive | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao listar dependências transitivas."
          }
          if ($packages -match "SixLabors.ImageSharp") {
            throw "SixLabors.ImageSharp continua no grafo de dependências. Investigar antes de liberar."
          }

      - name: Report vulnerable transitive packages
        shell: pwsh
        run: |
          dotnet list src/AssinaPDF.CrossPlatform/AssinaPDF.MacPrototype.csproj package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao consultar a auditoria de pacotes NuGet."
          }

      - name: Run CrossPlatform tests
        run: dotnet test tests/AssinaPDF.CrossPlatform.Tests/AssinaPDF.CrossPlatform.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=AssinaPDF-CrossPlatform.trx"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/AssinaPDF.CrossPlatform/AssinaPDF.MacPrototype.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o artifacts/publish/win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "Falha na publicação Windows x64."
          }
          if (!(Test-Path "artifacts/publish/win-x64/AssinaPDF.MacPrototype.exe")) {
            throw "Executável Windows não foi gerado."
          }

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AssinaPDF-CrossPlatform-Windows-x64-validation
          path: |
            artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 7
