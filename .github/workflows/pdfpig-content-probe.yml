name: PdfPig Content Probe Build

on:
  push:
    branches:
      - experiment/pdf-glyph-edit-lab
    paths:
      - "experiments/PdfPigContentProbe/**"
      - ".github/workflows/pdfpig-content-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore experiments/PdfPigContentProbe/PdfPigContentProbe.csproj
      - name: Build
        run: dotnet build experiments/PdfPigContentProbe/PdfPigContentProbe.csproj -c Release --no-restore
